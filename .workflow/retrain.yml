name: MLflow Retrain and Docker Build CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Workflow-CI/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    name: Retrain Model & Build Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==3.12.0 scikit-learn pandas numpy matplotlib seaborn dagshub nltk

    - name: Run MLflow Project (Retrain Model)
      run: |
        # Menjalankan MLflow Project menggunakan entry point main dengan parameter kustom
        mlflow run Workflow-CI/MLProject --no-conda -P C=10.0 -P max_iter=1000

    - name: Upload Trained Model Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: trained-sentiment-model
        path: Workflow-CI/MLProject/model_output/
        retention-days: 7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image using MLflow build-docker
      run: |
        # Membangun Docker Image mandiri dari model hasil latih lokal
        mlflow models build-docker -m Workflow-CI/MLProject/model_output/ -n ihksandev/workflow-ci-ml-stream-review:latest --enable-mlserver

    - name: Push Docker Image to Docker Hub
      run: |
        # Mengunggah Docker Image ke Docker Hub
        docker push ihksandev/workflow-ci-ml-stream-review:latest
